<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventEase – College Event Registration & Check-In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--ink:#172033;--mut:#64748b;--line:#e5eaf2;--pri:#4f46e5;--pri2:#7c3aed;--bg:#f6f7fb;--ok:#15803d;--bad:#dc2626;--surface:#fff;--shadow:0 10px 30px rgba(30,41,59,.07)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px max(5vw,20px);min-height:68px}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px;box-shadow:0 7px 16px #4f46e544}
.links{display:flex;gap:8px;font-size:14px;font-weight:600;color:#475569}
.links a{padding:9px 13px;border-radius:10px;transition:.18s}
.links a.on,.links a:hover{color:var(--pri);background:#eef2ff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:12px 19px;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;transition:transform .18s,box-shadow .18s,filter .18s;box-shadow:0 6px 14px #4f46e526}
.btn:hover{filter:brightness(.97);transform:translateY(-1px);box-shadow:0 9px 20px #4f46e533}.btn.ghost{background:#fff;color:var(--pri);border:1px solid #dfe3f2;box-shadow:none}.btn.sm{padding:8px 12px;font-size:12px}.btn.red{background:var(--bad);box-shadow:none}
.btn:disabled{background:#c7c9d9;cursor:not-allowed}
.hero{background:radial-gradient(ellipse at 50% -20%,#dfe2ff 0,transparent 55%),linear-gradient(145deg,#fafaff,#f1f3ff);text-align:center;padding:clamp(48px,8vw,88px) 6vw 64px;border-bottom:1px solid #e9eaff}
.hero .ic{width:68px;height:68px;border-radius:22px;background:linear-gradient(145deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;margin:0 auto 24px;font-size:30px;box-shadow:0 12px 26px #4f46e544}
.hero h1{font-size:clamp(35px,6vw,62px);font-weight:800;line-height:1.06;letter-spacing:-.045em}
.hero h1 span{background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;color:transparent;display:block}
.hero p{max-width:650px;margin:20px auto 28px;color:#526078;font-size:clamp(15px,2vw,18px)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(90px,150px));justify-content:center;gap:12px;margin-top:44px}
.stats>div{background:#ffffffb8;border:1px solid #e8e9f6;border-radius:16px;padding:15px 12px;box-shadow:0 6px 18px #3341550b}
.stats b{display:block;font-size:25px;color:var(--pri);line-height:1.2}.stats small{color:var(--mut);font-size:12px}
.wrap{padding:clamp(28px,5vw,52px) max(5vw,20px);max-width:1240px;margin:auto}
h2{font-size:clamp(22px,3vw,29px);font-weight:800;letter-spacing:-.03em}.sub{color:var(--mut);margin:5px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.ev h3{font-size:18px;margin-bottom:6px}.ev p{color:var(--mut);font-size:14px;margin-bottom:12px}
.meta{font-size:13px;color:#374151;display:grid;gap:4px;margin-bottom:14px}
.bar{height:7px;background:#eef0f6;border-radius:9px;overflow:hidden;margin:7px 0 15px}.bar div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:inherit}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:#dcfce7;color:#15803d}.tag.x{background:#fee2e2;color:#b91c1c}.tag.y{background:#e0e7ff;color:var(--pri)}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid #d5dbea;border-radius:11px;padding:12px 13px;font:16px Inter,system-ui,sans-serif;background:#fff;color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--pri)}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.form{max-width:560px;margin:auto}
.ticket{max-width:410px;margin:auto;border-radius:20px;overflow:hidden;box-shadow:0 16px 42px #4338ca26;text-align:center;background:#fff;border:1px solid var(--line)}
.ticket .top{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:22px}
.ticket .top small{opacity:.8}.ticket .top h3{font-size:24px}
.ticket .body{padding:20px}.code{font:700 22px ui-monospace,monospace;letter-spacing:1px;margin:12px 0}
#qr{display:inline-block;padding:10px;border:1px solid var(--line);border-radius:10px}
.lay{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 68px);max-width:1600px;margin:auto;background:#fafbfe}
.side{border-right:1px solid var(--line);padding:22px 14px;background:#fff}
.side a{display:block;padding:11px 13px;border-radius:10px;font-size:14px;font-weight:600;color:#475569;margin-bottom:5px;transition:.18s}
.side a.on{background:#eef2ff;color:var(--pri)}.side h5{font-size:11px;color:var(--mut);margin:0 12px 10px;text-transform:uppercase}
.main{padding:clamp(20px,4vw,38px);background:#f8f9fc;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:#fff;border-radius:16px;border:1px solid var(--line);padding:19px;box-shadow:0 7px 22px #3341550a}.kpi b{font-size:30px;color:var(--pri);display:block;letter-spacing:-.04em}.kpi span{color:var(--mut);font-size:13px}
.kpi.bl{background:#0ea5e9;color:#fff;border:0}.kpi.bl b,.kpi.bl span{color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.row input,.row select{width:auto;flex:1;min-width:150px}
.res{border:2px solid;border-radius:16px;padding:18px 20px;margin-top:18px;background:#fff;box-shadow:var(--shadow)}
.res.ok{border-color:var(--ok)}.res.no{border-color:var(--bad)}.res h3{display:flex;justify-content:space-between;align-items:center}
#reader{width:100%;max-width:360px;margin-top:12px;border-radius:12px;overflow:hidden}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px;border-top:1px solid var(--line);background:#fff}
button,a,input,select,textarea{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
@media(max-width:760px){
 nav{padding:10px 16px;min-height:62px;gap:10px}.logo{font-size:15px}.logo i{width:34px;height:34px;border-radius:11px}
 .links{gap:2px}.links a{font-size:12px;padding:9px 8px}
 .hero{padding:48px 20px 36px}.hero .ic{width:58px;height:58px;margin-bottom:20px}.hero p{margin:16px auto 22px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));max-width:360px;margin:30px auto 0}.stats>div{padding:13px 8px}
 .wrap{padding:28px 16px}.grid{grid-template-columns:1fr;gap:14px}.card{padding:18px;border-radius:16px}
 .lay{grid-template-columns:1fr;min-height:calc(100vh - 62px)}
 .side{position:sticky;top:62px;z-index:8;display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;scrollbar-width:none}
 .side::-webkit-scrollbar{display:none}.side h5{display:none}.side a{white-space:nowrap;margin:0;padding:10px 12px;flex:0 0 auto}
 .main{padding:20px 14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:15px}.kpi b{font-size:25px}
 .row{align-items:stretch}.row input,.row select{width:100%;min-width:0;flex:1 1 100%}.row .btn{width:100%;min-height:46px}
 .form{max-width:none}.ticket{max-width:100%;border-radius:18px}.ticket .body{padding:18px}
 .tw{margin:0 -4px}table{font-size:12px}th,td{padding:9px 8px}
 #reader{max-width:100%}
}
@media(max-width:390px){nav{padding-inline:11px}.links a{font-size:11px;padding:8px 6px}.logo{gap:7px}.logo i{width:31px;height:31px}.side a{font-size:12px;padding:9px 10px}.kpi span{font-size:12px}}
@media print{nav,footer,.noprint{display:none!important}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="#/"><i>▦</i>EventEase</a>
  <div class="links"><a href="#/events" data-r="events">Events</a><a href="#/mine" data-r="mine">My Registrations</a><a href="#/org" data-r="org">Organizer</a></div>
</nav>
<div id="app"></div>
<footer>EventEase · College event registration & QR check-in</footer>
<div id="toast"></div>
<script>
/* ---------- Pages demo API (saved in this browser only) ---------- */
const PIN_K='ee_pin';
const DATA_K='ee_data';
const seed=()=>({seq:1041,regs:[],events:[
 {id:'e1',name:'College Hackathon',desc:'24-hour build sprint. Teams of up to 4 ship a working prototype.',date:'2026-11-14T09:00',venue:'College Auditorium',cap:100,open:true},
 {id:'e2',name:'Cultural Fest',desc:'Music, dance and art showcase from every department.',date:'2026-11-21T17:00',venue:'Main Ground',cap:200,open:true},
 {id:'e3',name:'Tiny Demo Day',desc:'Only 2 seats – perfect for testing the "event full" rule.',date:'2026-11-28T11:00',venue:'Seminar Hall B',cap:2,open:true}]});
let db;try{db=JSON.parse(localStorage.getItem(DATA_K))||seed()}catch{db=seed()}
function save(){localStorage.setItem(DATA_K,JSON.stringify(db))}
const pub=e=>({...e,registered:db.regs.filter(r=>r.eventId===e.id&&r.status==='valid').length,attended:db.regs.filter(r=>r.eventId===e.id&&r.checkedIn).length});
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)};
const evOf=id=>db.events.find(e=>e.id===id);
const left=e=>e.cap-e.registered;
async function api(path,opt={}){
 const method=opt.method||'GET',b=opt.body||{},[raw,a,c]=path.split('/'),[p]=raw.split('?');
 if(method==='GET'&&p==='events')return{events:db.events.map(pub)};
 if(method==='GET'&&p==='regs')return sessionStorage.getItem(PIN_K)==='1234'?{regs:db.regs}:{error:'Organizer PIN required'};
 if(method==='GET'&&p==='ticket'){const r=db.regs.find(x=>x.id===a);return r?{reg:r,event:db.events.find(e=>e.id===r.eventId)}:{error:'Ticket not found'}}
 if(method==='GET'&&p==='mine'){const em=new URLSearchParams(raw.split('?')[1]||'').get('email')||'';return{regs:db.regs.filter(r=>r.email===em)}}
 if(p==='auth')return sessionStorage.getItem(PIN_K)==='1234'?{ok:true}:{error:'Organizer PIN required'};
 if(method==='POST'&&p==='register'){
  const name=String(b.name||'').trim(),email=String(b.email||'').trim().toLowerCase(),college=String(b.college||'').trim(),e=db.events.find(x=>x.id===b.eventId),errs={};
  if(name.length<2)errs.name='Enter your full name.';if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(email))errs.email='Enter a valid email address.';if(college.length<2)errs.college='Enter your college name.';if(!e)errs.eventId='Select an event.';
  if(Object.keys(errs).length)return{errs};if(!e.open)return{errs:{eventId:'Registration for this event is closed.'}};
  if(db.regs.filter(r=>r.eventId===e.id&&r.status==='valid').length>=e.cap)return{errs:{eventId:'This event is full. No seats left.'}};
  if(db.regs.some(r=>r.eventId===e.id&&r.email===email&&r.status==='valid'))return{errs:{email:'This email is already registered for this event.'}};
  const reg={id:'ENTRY-'+(++db.seq),eventId:e.id,name,email,college,at:Date.now(),checkedIn:false,checkedAt:null,status:'valid'};db.regs.push(reg);save();return{reg};
 }
 if(sessionStorage.getItem(PIN_K)!=='1234')return{error:'Organizer PIN required'};
 if(method==='POST'&&p==='events'&&!a){
  const cap=Math.floor(+b.cap);if(String(b.name||'').trim().length<3)return{errs:{name:'Enter an event name.'}};if(!b.date)return{errs:{date:'Pick a date and time.'}};if(!String(b.venue||'').trim())return{errs:{venue:'Enter a venue.'}};if(!(cap>=1&&cap<=100000))return{errs:{cap:'Capacity must be at least 1.'}};
  const e={id:'e'+Date.now(),name:b.name.trim(),desc:String(b.desc||'').trim(),date:b.date,venue:b.venue.trim(),cap,open:true};db.events.push(e);save();return{event:pub(e)}
 }
 if(method==='POST'&&p==='events'&&c==='toggle'){const e=db.events.find(x=>x.id===a);if(!e)return{error:'No such event'};e.open=!e.open;save();return{event:pub(e)}}
 if(method==='POST'&&p==='regs'&&c==='cancel'){const r=db.regs.find(x=>x.id===a);if(!r)return{error:'No such registration'};if(r.checkedIn)return{error:'Already checked in – cannot cancel.'};r.status='cancelled';save();return{reg:r}}
 if(method==='POST'&&p==='checkin'){const r=db.regs.find(x=>x.id===String(b.code||'').trim().toUpperCase());if(!r)return{ok:false,title:'Invalid code',msg:'No registration found for this code.'};const e=db.events.find(x=>x.id===r.eventId);if(r.checkedIn)return{ok:false,title:'Already checked in',msg:'Already checked in. This ticket has been used.',r,e};if(r.status!=='valid')return{ok:false,title:'Ticket not valid',msg:'Invalid or cancelled ticket.',r,e};if(b.eventId&&r.eventId!==b.eventId)return{ok:false,title:'Wrong event',msg:'This ticket is for '+e.name+'.',r,e};if(db.regs.filter(x=>x.eventId===e.id&&x.checkedIn).length>=e.cap)return{ok:false,title:'Capacity reached',msg:'Event attendance is at capacity.',r,e};r.checkedIn=true;r.checkedAt=Date.now();save();return{ok:true,title:'Accepted',msg:'Check-in successful! Welcome to the event.',r,e}}
 if(method==='POST'&&p==='reset'){db=seed();save();return{ok:true}}
 return{error:'Not found'}
}
const register=f=>api('register',{method:'POST',body:f});
const checkIn=(code,eventId)=>api('checkin',{method:'POST',body:{code,eventId}});

/* ---------- Views ---------- */
const V={};
V.home=()=>`<section class="hero"><div class="ic">▦</div>
<h1>Campus Event<span>Management</span><span>Made Simple</span></h1>
<p>Create events, register in seconds, get a unique QR ticket and check in at the gate – no spreadsheets, no duplicates.</p>
<a class="btn" href="#/events">Browse Events →</a>
<div class="stats"><div><b>${db.events.length}</b><small>Events</small></div><div><b>${db.events.reduce((s,e)=>s+e.registered,0)}</b><small>Registrations</small></div><div><b>${db.events.reduce((s,e)=>s+e.attended,0)}</b><small>Checked in</small></div><div><b>1 scan</b><small>Per ticket</small></div></div></section>
<div class="wrap"><h2 style="text-align:center">Everything You Need for Event Success</h2><p class="sub" style="text-align:center">Two simple experiences – one for participants, one for organizers.</p>
<div class="grid"><div class="card"><h3>🎟 Participants</h3><p class="sub">Browse events, register with your email and receive a QR entry ticket instantly.</p><a class="btn ghost" href="#/events">View events</a></div>
<div class="card"><h3>🛠 Organizers</h3><p class="sub">Create events, set capacity, track registrations and scan tickets at the door.</p><a class="btn ghost" href="#/org">Open dashboard</a></div></div></div>`;

V.events=()=>`<div class="wrap"><h2>Upcoming Events</h2><p class="sub">Pick an event and register to get your entry code.</p><div class="grid">${db.events.map(e=>{
 const l=left(e),pct=Math.round(100*(e.cap-l)/e.cap),st=!e.open?['Closed','x']:l<=0?['Full','x']:['Registration Open',''];
 return`<div class="card ev"><span class="tag ${st[1]}">${st[0]}</span><h3 style="margin-top:10px">${esc(e.name)}</h3><p>${esc(e.desc)}</p>
 <div class="meta"><span>📅 ${fmt(e.date)}</span><span>📍 ${esc(e.venue)}</span><span>👥 ${l} of ${e.cap} seats left</span></div>
 <div class="bar"><div style="width:${pct}%"></div></div>
 <a class="btn ${st[1]?'ghost':''}" ${st[1]?'style="pointer-events:none;opacity:.5"':''} href="#/register/${e.id}">Register</a></div>`}).join('')}</div></div>`;

V.register=id=>{const opts=db.events.map(e=>`<option value="${e.id}" ${e.id===id?'selected':''}>${esc(e.name)} (${left(e)} seats left)</option>`).join('');
return`<div class="wrap"><div class="form card"><h2>Event Registration</h2><p class="sub">Fill in your details to get a QR ticket.</p>
<form id="rf" novalidate><label>Full name</label><input name="name" placeholder="Akash Kumar"><div class="err" data-e="name"></div>
<label>Email address</label><input name="email" type="email" placeholder="you@college.edu"><div class="err" data-e="email"></div>
<label>College name</label><input name="college" placeholder="ABC Institute of Technology"><div class="err" data-e="college"></div>
<label>Event selection</label><select name="eventId"><option value="">Select an event</option>${opts}</select><div class="err" data-e="eventId"></div>
<button class="btn" style="width:100%;justify-content:center;margin-top:22px">Register Now</button></form></div></div>`};

V.ticket=(r,e)=>{
if(!r)return`<div class="wrap"><p>Ticket not found. <a href="#/mine" style="color:var(--pri)">My registrations</a></p></div>`;
return`<div class="wrap"><div class="ticket"><div class="top"><small>EventEase Ticket</small><h3>${esc(e.name)}</h3><small>${fmt(e.date)} · ${esc(e.venue)}</small></div>
<div class="body"><div id="qr"></div><div class="code">${r.id}</div><div><b>Participant:</b> ${esc(r.name)}</div><small style="color:var(--mut)">${esc(r.email)}</small>
<p style="margin:14px 0"><span class="tag ${r.checkedIn?'y':''}">${r.status!=='valid'?'Cancelled':r.checkedIn?'Checked in':'Valid · show at entry'}</span></p>
<div class="noprint" style="display:flex;gap:8px;justify-content:center"><button class="btn sm" onclick="print()">Save / Print</button><a class="btn sm ghost" href="#/mine">My tickets</a></div></div></div></div>`};

V.mine=list=>{const em=localStorage.getItem('ee_email')||'';
return`<div class="wrap"><h2>My Registrations</h2><p class="sub">Enter the email you registered with to see your tickets.</p>
<div class="row"><input id="me" type="email" placeholder="you@college.edu" value="${esc(em)}"><button class="btn" id="mebtn">Find tickets</button></div>
<div class="grid">${list.map(r=>{const e=evOf(r.eventId);return`<div class="card"><h3>${esc(e?.name)}</h3><div class="code" style="font-size:18px">${r.id}</div><p class="sub" style="margin:0 0 12px">${r.checkedIn?'Checked in':r.status==='valid'?'Not yet checked in':'Cancelled'}</p><a class="btn sm" href="#/ticket/${r.id}">Show QR ticket</a></div>`}).join('')||(em?'<p>No registrations found for this email.</p>':'')}</div></div>`};

const tabs=[['overview','Dashboard'],['create','Create Event'],['regs','Registrations'],['checkin','QR Check-in']];
const shell=(t,html)=>`<div class="lay"><aside class="side"><h5>Organizer</h5>${tabs.map(([k,n])=>`<a href="#/org/${k}" class="${k===t?'on':''}">${n}</a>`).join('')}</aside><main class="main">${html}</main></div>`;

V.org=(t='overview')=>{
 if(t==='create')return shell(t,`<h2>Create Event</h2><p class="sub">Create a new event here.</p><div class="card form" style="margin:0"><form id="ef" novalidate>
 <label>Event name</label><input name="name" placeholder="College Hackathon"><div class="err" data-e="name"></div>
 <label>Description</label><textarea name="desc" rows="4" placeholder="What is this event about?"></textarea>
 <label>Date and time</label><input name="date" type="datetime-local"><div class="err" data-e="date"></div>
 <label>Venue</label><input name="venue" placeholder="College Auditorium"><div class="err" data-e="venue"></div>
 <label>Participant capacity</label><input name="cap" type="number" min="1" placeholder="100"><div class="err" data-e="cap"></div>
 <button class="btn" style="margin-top:22px">Create Event</button></form></div>`);
 if(t==='regs'){const evs=db.events;return shell(t,`<h2>Registrations</h2><p class="sub">Participant list with live status.</p>
 <div class="row"><select id="fe"><option value="">All events</option>${evs.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><input id="fs" placeholder="Search name, email or code"><button class="btn ghost" id="csv">Export CSV</button></div>
 <div class="tw"><table><thead><tr><th>Code</th><th>Name</th><th>Email</th><th>College</th><th>Event</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`)}
 if(t==='checkin')return shell(t,`<h2>QR Check-in</h2><p class="sub">Scan a ticket with the camera or type the entry code.</p>
 <div class="card"><div class="row"><select id="cf"><option value="">Any event</option>${db.events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
 <div class="row"><input id="cc" placeholder="ENTRY-1042" autocomplete="off"><button class="btn" id="cb">Check in</button></div>
 <button class="btn ghost sm" id="cam">📷 Start camera scan</button><div id="reader"></div></div><div id="cr"></div>
 <div class="kpis" style="margin-top:20px" id="ck"></div>`);
 const R={length:db.events.reduce((s,e)=>s+e.registered,0)},A={length:db.events.reduce((s,e)=>s+e.attended,0)},tot=db.events.reduce((s,e)=>s+e.cap,0);
 return shell(t,`<h2>Dashboard</h2><p class="sub">Registration and attendance at a glance.</p>
 <div class="kpis"><div class="kpi bl"><b>${A.length} / ${R.length}</b><span>Checked in / registered</span></div><div class="kpi"><b>${R.length}</b><span>Registrations</span></div><div class="kpi"><b>${A.length}</b><span>Attendance</span></div><div class="kpi"><b>${tot-R.length}</b><span>Seats left overall</span></div></div>
 <div class="tw"><table><thead><tr><th>Event</th><th>Capacity</th><th>Registered</th><th>Attended</th><th>Fill</th><th>Status</th><th></th></tr></thead><tbody>${db.events.map(e=>{const g=e.registered,a=e.attended;return`<tr><td><b>${esc(e.name)}</b></td><td>${e.cap}</td><td>${g}</td><td>${a}</td><td style="min-width:120px"><div class="bar" style="margin:0"><div style="width:${100*g/e.cap}%"></div></div></td><td><span class="tag ${e.open?'':'x'}">${e.open?'Open':'Closed'}</span></td><td><button class="btn sm ghost" data-tg="${e.id}">${e.open?'Close':'Reopen'}</button></td></tr>`}).join('')}</tbody></table></div>
 <div style="margin-top:20px"><button class="btn ghost sm" id="rst">Reset demo data</button></div>`);
};

V.login=()=>`<div class="wrap"><div class="form card"><h2>Organizer sign in</h2><p class="sub">Enter the organizer PIN to manage events and check people in.</p><label>PIN</label><input id="pin" type="password" autocomplete="off"><div class="err" id="perr"></div><button class="btn" id="pb" style="margin-top:18px">Sign in</button></div></div>`;
let scanner=null,live=null,rt=0;
async function stopCam(){if(scanner){try{await scanner.stop();scanner.clear()}catch(_){ }scanner=null}}
function showErrs(errs){document.querySelectorAll('.err').forEach(d=>d.textContent=errs[d.dataset.e]||'')}
const loadEvents=async()=>{const r=await api('events');if(r.events)db.events=r.events;else if(r.error)toast(r.error)};
const loadRegs=async()=>{const r=await api('regs');db.regs=r.regs||[]};
async function route(silent){
 const my=++rt;await stopCam();live=null;
 const [,p='',a,b]=location.hash.split('/'),app=$('#app'),t=a||'overview';
 document.querySelectorAll('.links a').forEach(x=>x.classList.toggle('on',x.dataset.r===p));
 await loadEvents();let html,tk,mine;
 if(p==='ticket'){tk=await api('ticket/'+encodeURIComponent(a));html=V.ticket(tk.reg,tk.event);
   live=async()=>{const x=await api('ticket/'+encodeURIComponent(a)),el=$('.ticket .tag');if(el&&x.reg){el.className='tag '+(x.reg.checkedIn?'y':'');el.textContent=x.reg.status!=='valid'?'Cancelled':x.reg.checkedIn?'Checked in':'Valid · show at entry'}}}
 else if(p==='mine'){const em=localStorage.getItem('ee_email')||'';mine=em?(await api('mine?email='+encodeURIComponent(em))).regs||[]:[];html=V.mine(mine)}
 else if(p==='org'){const au=await api('auth');if(!au.ok)html=V.login();else{if(t==='regs')await loadRegs();html=V.org(t)}}
 else html=p==='events'?V.events():p==='register'?V.register(a):V.home();
 if(my!==rt)return;
 app.innerHTML=html;if(!silent)scrollTo(0,0);
 if(p==='events'||(p==='org'&&t==='overview'&&$('.kpis')))live=()=>route(true);
 if(p==='ticket'&&tk.reg)new QRCode($('#qr'),{text:a,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});
 if(p==='register')$('#rf').onsubmit=async ev=>{ev.preventDefault();const btn=ev.target.querySelector('button');btn.disabled=true;
   const r=await register(Object.fromEntries(new FormData(ev.target)));btn.disabled=false;
   if(r.error)return toast(r.error);if(r.errs)return showErrs(r.errs);
   localStorage.setItem('ee_email',r.reg.email);toast('Registration successful!');location.hash='#/ticket/'+r.reg.id};
 if(p==='mine')$('#mebtn').onclick=()=>{localStorage.setItem('ee_email',$('#me').value.trim().toLowerCase());route()};
 if(p==='org'){if($('#pb')){const go=async()=>{sessionStorage.setItem(PIN_K,$('#pin').value);const au=await api('auth');if(au.ok)route();else{sessionStorage.removeItem(PIN_K);$('#perr').textContent='Wrong PIN.'}};$('#pb').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()}}else orgInit(t)}
}
function orgInit(t){
 if(t==='create')$('#ef').onsubmit=async ev=>{ev.preventDefault();const r=await api('events',{method:'POST',body:Object.fromEntries(new FormData(ev.target))});
  if(r.error)return toast(r.error);if(r.errs)return showErrs(r.errs);toast('Event created');location.hash='#/org/overview'};
 if(t==='overview'){document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{await api('events/'+b.dataset.tg+'/toggle',{method:'POST'});route(true)});
  $('#rst').onclick=async()=>{if(confirm('Delete all events and registrations and restore sample data?')){await api('reset',{method:'POST'});route()}}}
 if(t==='regs'){const draw=()=>{const ev=$('#fe').value,q=$('#fs').value.toLowerCase();
   $('#tb').innerHTML=db.regs.filter(r=>(!ev||r.eventId===ev)&&(r.id+r.name+r.email).toLowerCase().includes(q)).map(r=>`<tr><td><a href="#/ticket/${r.id}" style="color:var(--pri);font-weight:600">${r.id}</a></td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.college)}</td><td>${esc(evOf(r.eventId)?.name)}</td><td><span class="tag ${r.status!=='valid'?'x':r.checkedIn?'y':''}">${r.status!=='valid'?'Cancelled':r.checkedIn?'Checked in':'Registered'}</span></td><td>${r.status==='valid'&&!r.checkedIn?`<button class="btn sm red" data-c="${r.id}">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">No registrations yet.</td></tr>';
   document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const r=await api('regs/'+b.dataset.c+'/cancel',{method:'POST'});toast(r.error||'Registration cancelled');await loadRegs();draw()})};
  $('#fe').onchange=draw;$('#fs').oninput=draw;draw();live=async()=>{await loadRegs();draw()};
  $('#csv').onclick=()=>{const rows=[['Code','Name','Email','College','Event','Status','Checked in at']].concat(db.regs.map(r=>[r.id,r.name,r.email,r.college,evOf(r.eventId)?.name,r.status,r.checkedAt?new Date(r.checkedAt).toLocaleString():'']));
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='eventease-registrations.csv';a.click()}}
 if(t==='checkin'){let last='',lt=0,busy=false;
  const stats=()=>{$('#ck').innerHTML=db.events.map(e=>`<div class="kpi"><b>${e.attended} / ${e.registered}</b><span>${esc(e.name)} · attended / registered</span></div>`).join('')};
  const run=async raw=>{if(busy)return;busy=true;const r=await checkIn(raw,$('#cf').value);busy=false;
   if(!r.title)return toast(r.error||'Check-in failed');
   $('#cr').innerHTML=`<div class="res ${r.ok?'ok':'no'}"><h3><span>${r.ok?'✅':'❌'} ${r.ok?'First scan':r.title}</span><span class="tag ${r.ok?'':'x'}">${r.ok?'Accepted':'Rejected'}</span></h3><p style="margin-top:8px;font-size:17px">“${esc(r.msg)}”</p>${r.r?`<p class="sub" style="margin:8px 0 0">${esc(r.r.name)} · ${r.r.id} · ${esc(r.e?.name||'')}</p>`:''}</div>`;
   toast(r.ok?'Check-in successful':'Rejected: '+r.title);await loadEvents();stats()};
  $('#cb').onclick=()=>{run($('#cc').value);$('#cc').value='';$('#cc').focus()};
  $('#cc').onkeydown=e=>{if(e.key==='Enter')$('#cb').click()};
  $('#cam').onclick=async()=>{if(scanner){await stopCam();return}
   if(typeof Html5Qrcode==='undefined')return toast('Scanner library not loaded – use manual entry');
   scanner=new Html5Qrcode('reader');
   try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:220},txt=>{const n=Date.now();if(txt===last&&n-lt<3000)return;last=txt;lt=n;run(txt)})}
   catch(e){scanner=null;toast('Camera unavailable – allow permission or use manual entry')}};
  stats();live=async()=>{await loadEvents();stats()}}
}
addEventListener('hashchange',()=>route());route();
setInterval(()=>{if(!document.hidden&&live)live()},3000);
</script>
</body>
</html>
